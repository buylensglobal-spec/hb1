<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile | HackBridge</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container topbar">
        <div class="brand">
          <img class="brand-mark" src="HackBridgeLogo.png" alt="HackBridge logo" />
          <div class="brand-name">HackBridge</div>
        </div>

        <div class="header-actions">
          <a class="secondary-btn" href="signin.html">Sign in</a>
          <a class="primary-btn" href="login.html">Login</a>
          <a class="profile-chip" href="profile.html" aria-label="Open student profile" data-profile-chip hidden>
            <img src="HackBridgeLogo.png" data-profile-image alt="Student profile" />
            <div>
              <strong data-profile-name></strong>
              <span data-profile-email></span>
            </div>
          </a>
        </div>
      </div>

      <nav class="container navbar" aria-label="Main navigation">
        <a class="nav-link" href="index.html" data-page="index.html">Home</a>
        <a class="nav-link" href="hackathons.html" data-page="hackathons.html">Hackathons</a>
        <a class="nav-link" href="internships.html" data-page="internships.html">Internships</a>
        <a class="nav-link" href="language-club.html" data-page="language-club.html">Language Club</a>
        <a class="nav-link" href="youtube.html" data-page="youtube.html">YouTube</a>
      </nav>
    </header>

    <main class="container page-shell">
      <div class="section-heading">
        <h2>Profile</h2>
        <div class="profile-actions">
          <a class="secondary-btn" href="add-project.html">Add Project</a>
          <a class="primary-btn" href="edit-profile.html">Edit Details</a>
        </div>
      </div>

      <div class="profile-layout">
        <aside class="card user-card">
          <img class="profile-page-image" data-profile-image src="HackBridgeLogo.png" alt="Profile picture" />
          <h3 data-profile-page-name></h3>
          <p class="muted" data-profile-page-email></p>
        </aside>

        <div class="info-stack">
          <section class="info-card">
            <h3>Account</h3>
            <ul class="info-list" data-student-details></ul>
          </section>
        </div>
      </div>

      <section class="profile-projects">
        <div class="section-heading">
          <h2>Projects</h2>
          <span class="muted">Your work and presentations</span>
        </div>
        <div class="projects-grid" data-student-projects></div>
      </section>
    </main>

    <footer>
      <div class="container footer-inner">
        <div>© 2026 HackBridge</div>
        <div>Future-focused education for learners & builders</div>
      </div>
    </footer>

    <script type="module" src="script.js"></script>
  </body>
</html>
